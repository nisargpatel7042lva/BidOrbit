<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 64 64">
  <!-- Neo-brutalist yellow background -->
  <rect width="64" height="64" fill="#FFD93D"/>
  <!-- Thick black border -->
  <rect x="2" y="2" width="60" height="60" fill="none" stroke="#000" stroke-width="4"/>
  <!-- Gavel rotated -45°: head upper-left, handle lower-right -->
  <g transform="rotate(-45 32 32)">
    <!-- Gavel head (wide block) -->
    <rect x="18" y="14" width="28" height="12" fill="#000"/>
    <!-- Handle -->
    <rect x="27" y="26" width="10" height="28" fill="#000"/>
  </g>
</svg>
